version: 2

project_name: agent-tmux

builds:
  - id: agent-tmux
    main: ./cmd/agent-tmux
    binary: agent-tmux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  # Raw binaries, no archive: assets are agent-tmux-linux-amd64 and
  # agent-tmux-linux-arm64, so releases/latest/download/<name> is a stable URL.
  - id: agent-tmux
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  github:
    owner: mugenkunou
    name: agent-tmux
